# kind-config.yaml - cluster locale per la challenge Online Boutique
# Kubernetes 1.35.8 (immagine pre-costruita per kind v0.33.0, fissata per digest)
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: boutique
nodes:
  - role: control-plane
    image: kindest/node:v1.35.8@sha256:07b2536e30b803ed61d1677a79df6115f798ce64c80f9e22f6ed45afd09323c0
    # Le porte 8080/8443 dell'host (solo localhost) puntano ai NodePort di Traefik.
    # 80/443 sono già occupate sulla workstation da altri servizi.
    extraPortMappings:
      - containerPort: 30080
        hostPort: 8080
        listenAddress: "127.0.0.1"
        protocol: TCP
      - containerPort: 30443
        hostPort: 8443
        listenAddress: "127.0.0.1"
        protocol: TCP
  - role: worker
    image: kindest/node:v1.35.8@sha256:07b2536e30b803ed61d1677a79df6115f798ce64c80f9e22f6ed45afd09323c0
  - role: worker
    image: kindest/node:v1.35.8@sha256:07b2536e30b803ed61d1677a79df6115f798ce64c80f9e22f6ed45afd09323c0